  `townCoords` weiter unten im <script>-Bereich. Ändere NICHTS an
  HTML-Struktur, CSS oder der Render-/Karten-Logik (renderDashboard,
  renderMap). Jedes Listing braucht:
  id, title, town, price, sqm, plotSqm, condition, url, photo, note, isNew.
  Optional: lat, lng für die exakte Position (falls aus dem Inserat
  bekannt) — sonst wird automatisch der Ortsmittelpunkt aus townCoords
  verwendet. Ist ein Ort noch nicht in townCoords enthalten, ergänze ihn
  dort mit den korrekten Koordinaten (WGS84).
  Setze isNew:true nur für Objekte, die seit dem letzten Lauf neu
  hinzugekommen sind (Abgleich über id gegen listings.json im Repo).

  PFLICHT-FOTO: Öffne für JEDES Objekt (auch bereits bekannte aus
  früheren Läufen ohne Foto) die Detailseite direkt und extrahiere eine
  Bild-URL für `photo`. Am zuverlässigsten: das og:image-Meta-Tag im
  <head> der Seite. Erst wenn das fehlt, das erste Galerie-Bild
  versuchen. Nur wenn wirklich keine Bild-URL auffindbar ist, `photo`
  leer lassen — die Kachel zeigt dann automatisch eine gestaltete
  Platzhalter-Illustration statt eines Fotos, das ist bereits im Code
  eingebaut und muss nicht extra behandelt werden.

  SOLD-CHECK: Lösche NIEMALS ein bestehendes Objekt aus `listings`.
  Prüfe stattdessen bei jedem Lauf ca. 1/4 der bestehenden Objekte
  (rotierend, sodass nach 4 Läufen alle einmal geprüft wurden) durch
  Aufruf der jeweiligen `url`. Führt der Aufruf zu einer "nicht mehr
  verfügbar"-Meldung, einer Weiterleitung auf die Startseite oder einem
  404 (nach einem Wiederholungsversuch zur Sicherheit), setze
  `status: "sold"` bei diesem Objekt. Ändere sonst nichts an dem
  Objekt. Objekte ohne `status`-Feld gelten als weiterhin verfügbar.

  MAKLER: Erfasse zusätzlich das Feld `agency` — Name der Immobilien-
  Agentur/des Maklers laut Inserat (z.B. "Engel & Völkers", "Terra
  Italia", "Giovanna Ardoino Immobiliare"). Falls das Inserat direkt
  vom Eigentümer stammt (Privatverkauf), setze `agency: "Privat"`.
  Falls kein Makler/Anbieter ermittelbar ist, `agency` leer lassen.

      photo: "https://www.terra-italia.com/wp-content/uploads/2026/06/PE_1070_TERRA-ITALIA-IMMOBILIEN_LIGURIEN_VILLA_PERINALDO_PANORAMIC-VIEW_01-2-1170x785.jpeg",
      note: "3 Schlafzimmer, 3 Bäder. Moderne Villa mit Panorama-Meerblick auf großem, terrassiertem Grundstück mit Olivenhainen, Kamin, Solarthermie und Poolmöglichkeit.",
      isNew: false,
      agency: "Terra Italia",
      lastChecked: "01.09.2026"
    },
    {
      id: "diano-marina-ev-ulivi-meerblick-155",
      title: "Villa inmitten von Olivenbäumen mit Meerblick",
      town: "Diano Marina",
      price: "€ 635.000",
      sqm: "195 m²",
      plotSqm: "500 m² Grundstück",
      condition: "Baujahr 2002, gepflegt (Energieklasse D)",
      url: "https://www.engelvoelkers.com/it/de/exposes/0266fa1e-841b-56e9-8207-529c9b9e7b39",
      photo: "https://uploadcare.engelvoelkers.com/dfe9801c-1b08-401f-ba11-2192ad310f80/-/format/webp/-/stretch/off/-/progressive/yes/-/resize/1440x/-/quality/lighter/",
      note: "2 Schlafzimmer. Freistehende Villa auf 500 m² Grundstück inmitten von Olivenbäumen mit Panorama-Meerblick aufs Mittelmeer, Baujahr 2002 (Energieklasse D). Großzügige Wohnfläche von 195 m²; erfüllt das Mindestkriterium von 2 Schlafzimmern knapp. Ruhige, küstennahe Lage oberhalb von Diano Marina.",
      isNew: true,
      agency: "Engel & Völkers",
      lastChecked: "01.10.2026"
    },
  ];
  // ──────────────────────────────────────────────────────────────────────

  // ── Favoriten (im Browser gespeichert, pro Gerät) ───────────────────
  const FAV_KEY = "liguria-favorites";

  function getFavorites() {
    try {
      return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]"));
    } catch { return new Set(); }
  }

  function toggleFavorite(id) {
    const favs = getFavorites();
    favs.has(id) ? favs.delete(id) : favs.add(id);
    localStorage.setItem(FAV_KEY, JSON.stringify([...favs]));
    renderDashboard();
  }

  function card(item) {
    const isSold = item.status === "sold";
    const stamp = item.isNew && !isSold ? `<span class="stamp">Nuovo</span>` : "";
    const soldStamp = isSold ? `<span class="sold-stamp">Verkauft</span>` : "";
    const isFav = getFavorites().has(item.id);
    const hasPhoto = Boolean(item.photo);
    const photoInner = hasPhoto
      ? `<img src="${item.photo}" alt="${item.title}">`
      : `<svg class="ph-illustration" viewBox="0 0 100 75" xmlns="http://www.w3.org/2000/svg">
           <circle cx="78" cy="18" r="8" fill="var(--sun)" opacity="0.6"/>
           <path d="M0 55 L20 35 L35 50 L55 25 L75 48 L100 32 L100 75 L0 75 Z" fill="var(--olive)" opacity="0.5"/>
           <path d="M0 62 Q25 55 50 62 T100 62 L100 75 L0 75 Z" fill="var(--sea)" opacity="0.55"/>
         </svg>
         <span class="ph-label">Kein Foto verfügbar</span>`;
    return `
      <article class="card ${item.isNew && !isSold ? "is-new" : ""} ${isSold ? "is-sold" : ""}">
        ${stamp}${soldStamp}
        <button class="heart-btn ${isFav ? "is-fav" : ""}" onclick="toggleFavorite('${item.id}')" aria-label="Favorit">
          <svg class="heart-outline" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.1C.5 8.6 2.3 5 6 5c2 0 3.5 1.1 4.5 2.6C11.5 6.1 13 5 15 5c3.7 0 5.5 3.6 4 6.9C19.5 16.4 12 21 12 21z"/></svg>
        </button>
        <a class="photo-link" href="${item.url}" target="_blank" rel="noopener">
          <div class="photo ${hasPhoto ? "" : "no-photo"}">${photoInner}</div>
        </a>
        <div class="body">
          <span class="town">${item.town}</span>
          <h3 class="title">${item.title}</h3>
          <div class="price">${item.price}</div>
          <div class="meta-chips">
            <span>${item.sqm}</span>
            <span>${item.plotSqm}</span>
            <span>${item.condition}</span>
          </div>
          <p class="note">${item.note}</p>
          <div class="card-footer">
            <a class="link-btn" href="${item.url}" target="_blank" rel="noopener">Zum Inserat →</a>
            ${item.agency ? `<span class="agency">${item.agency}</span>` : ""}
          </div>
        </div>
      </article>`;
  }

  function renderDashboard() {
    const active = listings.filter(l => l.status !== "sold");
    const sold = listings.filter(l => l.status === "sold");
    const newOnes = active.filter(l => l.isNew);
    const favs = getFavorites();
    const favOnes = listings.filter(l => favs.has(l.id));
    const total = active.length;

    document.getElementById("statStrip").innerHTML = `
      <span>Aktualisiert: <b>${meta.lastUpdated}</b></span>
      <span>Objekte gesamt: <b>${total}</b></span>
      <span>Neu: <b>${newOnes.length}</b></span>
      <span>Preisrahmen: <b>${meta.priceRangeNote}</b></span>
    `;

    if (favOnes.length > 0) {
      document.getElementById("favSection").style.display = "";
      document.getElementById("favGrid").innerHTML = favOnes.map(card).join("");
    } else {
      document.getElementById("favSection").style.display = "none";
    }

    if (newOnes.length > 0) {
      document.getElementById("newSection").style.display = "";
      document.getElementById("newGrid").innerHTML = newOnes.map(card).join("");
    } else {
      document.getElementById("newSection").style.display = "none";
    }

    const allGrid = document.getElementById("allGrid");
    allGrid.innerHTML = active.length
      ? active.map(card).join("")
      : `<div class="empty">Aktuell keine passenden Objekte gefunden.</div>`;

    if (sold.length > 0) {
      document.getElementById("soldSection").style.display = "";
      document.getElementById("soldGrid").innerHTML = sold.map(card).join("");
    } else {
      document.getElementById("soldSection").style.display = "none";
    }

    document.getElementById("footerNote").textContent =
      `Nächste Aktualisierung: ${meta.nextUpdate} · Automatisch erstellt von der Claude Code Routine`;
  }

  function coordsFor(item) {
    if (item.lat && item.lng) return [item.lat, item.lng];
    if (townCoords[item.town]) return townCoords[item.town];
    return null;
  }

  function renderMap() {
    const active = listings.filter(l => l.status !== "sold");
    const points = active.map(coordsFor).filter(Boolean);
    if (points.length === 0) return;

    const map = L.map('map', { scrollWheelZoom: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
      maxZoom: 18
    }).addTo(map);

    const markers = [];
    active.forEach(item => {
      const pos = coordsFor(item);
      if (!pos) return;

      const icon = L.divIcon({
        className: '',
        html: `<div class="pin ${item.isNew ? 'pin-new' : 'pin-sea'}"></div>`,
        iconSize: [16, 16],
        iconAnchor: [8, 16]
      });

      const popupHtml = `
        <div class="map-popup">
          <div class="mp-town">${item.town}</div>
          <div class="mp-title">${item.title}</div>
          <div class="mp-price">${item.price}</div>
          <a href="${item.url}" target="_blank" rel="noopener">Zum Inserat →</a>
        </div>`;

      const marker = L.marker(pos, { icon }).addTo(map).bindPopup(popupHtml);
      markers.push(marker);
    });

    if (points.length === 1) {
      map.setView(points[0], 13);
    } else {
      map.fitBounds(L.latLngBounds(points), { padding: [30, 30] });
    }
  }

  renderDashboard();
  renderMap();
</script>

</body>
